<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
    <title>服务端日志</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; color: #252b36; background: #fff; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid #e8ebef; }
        h1 { margin: 0 auto 0 0; font-size: 16px; font-weight: 600; }
        button { flex-shrink: 0; padding: 6px 12px; border: 1px solid #d6dbe2; border-radius: 5px; color: inherit; background: #fff; font: inherit; cursor: pointer; }
        button:hover { background: #f3f5f8; }
        button:focus-visible { outline: 2px solid #1677ff; outline-offset: 2px; }
        textarea { flex: 1; width: 100%; min-height: 0; resize: none; padding: 16px 18px; border: 0; outline: none; color: #dce4ef; background: #18202c; font: 12px/1.7 Menlo, Consolas, monospace; tab-size: 4; }
        textarea::placeholder { color: #a5b0c2; }
        footer { display: flex; flex-direction: column; gap: 5px; padding: 10px 18px; border-top: 1px solid #e8ebef; color: #687385; font-size: 12px; }
        #path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
        #status { min-height: 17px; }
    </style>
    <script src="server-logs.js" defer></script>
</head>
<body>
    <header>
        <h1 id="heading">服务端日志</h1>
        <button id="refresh" type="button">刷新</button>
        <button id="copy" type="button">复制</button>
        <button id="open-directory" type="button">打开日志目录</button>
    </header>
    <textarea id="logs" readonly spellcheck="false" wrap="off" aria-label="服务端日志"></textarea>
    <footer>
        <div id="path"></div>
        <div id="status" role="status"></div>
    </footer>
</body>
</html>
