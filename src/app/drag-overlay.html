<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>drag-overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: visible;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #host { width: 100%; height: 100%; position: relative; overflow: visible; }
  #card { position: absolute; left: 4px; top: 4px; display: inline-flex; align-items: center; }
  #tip {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(255,77,79,0.4);
    color: white;
    background: #ff4d4f;
    border-radius: 10px;
    padding: 2px 10px;
    font-size: 12px;
    line-height: 18px;
    pointer-events: none;
  }
  #status {
    width: 1em;
    height: 1em;
    border-radius: 50%;
    display: inline-block;
    margin-left: 8px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  #label { display: inline-block; vertical-align: middle; max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div id="host">
    <div id="card">
      <span id="label"></span>
      <span id="status"></span>
    </div>
  </div>
<script>
  const { ipcRenderer } = require('electron');
  const card = document.getElementById('card');
  const labelEl = document.getElementById('label');
  const statusEl = document.getElementById('status');
  const host = document.getElementById('host');
  let tipEl = null;

  function removeTip() {
    if (tipEl && tipEl.parentNode) tipEl.parentNode.removeChild(tipEl);
    tipEl = null;
  }

  function applySnapshot(snap) {
    if (!snap) return false;
    if (typeof snap.label === 'string') labelEl.textContent = snap.label;
    if (typeof snap.connected === 'boolean') {
      statusEl.style.display = 'inline-block';
      statusEl.style.backgroundColor = snap.connected ? 'green' : 'red';
    } else {
      statusEl.style.display = 'none';
    }

    card.style.padding = snap.padding || '8px 16px';
    card.style.background = snap.background || '#fff';
    card.style.border = snap.border || '2px solid #1890ff';
    card.style.borderRadius = snap.borderRadius || '4px';
    card.style.boxShadow = snap.boxShadow || '0 12px 32px rgba(0,0,0,0.25)';
    card.style.opacity = (snap.opacity != null) ? String(snap.opacity) : '0.98';
    card.style.whiteSpace = 'nowrap';
    card.style.cursor = 'move';
    card.style.transition = 'transform 0.08s ease-out, background-color 0.12s ease-out, border-color 0.12s ease-out';
    card.style.transformOrigin = '0 0';
    const scale = snap.scale != null ? Number(snap.scale) : 1;
    card.style.transform = 'scale(' + scale + ')';

    if (snap.tip) {
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.id = 'tip';
        host.appendChild(tipEl);
      }
      tipEl.textContent = snap.tip;
      const cardRect = card.getBoundingClientRect();
      const cardW = (card.offsetWidth * scale);
      const cardL = 4;
      const cx = cardL + cardW / 2;
      tipEl.style.left = cx + 'px';
      tipEl.style.top = '-24px';
    } else {
      removeTip();
    }
    return true;
  }

  ipcRenderer.on('drag-overlay-data', (ev, data) => {
    if (!data) return;
    if (data.snapshot && applySnapshot(data.snapshot)) return;
    // legacy fallback
    if (typeof data.label === 'string') labelEl.textContent = data.label;
    if (typeof data.connected === 'boolean') {
      statusEl.style.display = 'inline-block';
      statusEl.style.backgroundColor = data.connected ? 'green' : 'red';
    }
    card.style.background = data.outside ? '#fff1f0' : '#fff';
    card.style.border = data.outside ? '2px solid #ff4d4f' : '2px solid #1890ff';
  });
</script>
</body>
</html>
